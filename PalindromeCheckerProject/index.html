<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Palindome Checker</title>
  </head>
  <body>
    <main>
      <h1>Is it a Palindrome?</h1>
      <form>
        <h2>Enter in text to check for a palindrome:</h2>
        <div>
          <input id="text-input" />
          <button id="check-btn" type="button">Check</button>
        </div>
        <div class="result-div" id="result"></div>
      </form>
      <p class="palindrome-instuction">
        <span role="img" aria-label="light-bulb">💡</span>

        A
        <dfn>palindrome</dfn>
        is a word or sentence that's spelled the same way both forward and
        backward, ignoring punctuation, case, and spacing.
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
