<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Telephone Number Validator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="main-text">
      <h1 class="title">Telephone Number Validator</h1>
    </header>

    <main>
      <div class="phone-container">
        <label for="user-input">Enter a Phone Number:</label>

        <input maxlength="20" type="text" id="user-input" value="" />
        <div id="results-div"></div>
        <div class="phone-footer">
          <button class="btn" id="check-btn" type="button">Check</button>
          <button class="btn" id="clear-btn" type="button">Clear</button>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
