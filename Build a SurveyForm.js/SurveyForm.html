<!DOCTYPE html>
<html lang="en">
  <head>
     <meta charset="UTF-8" />
    <title>Survey Formm</title>
    <link rel="stylesheet" href="stylesSurveyForm.css" />
</head>
<body>
  <h1 id="title">freeCodeCamp Survey Form</h1>
  <p id="description">Thank you for taking the time to help us improve the platform</p>
  <form id="survey-form">
    <label id="name-label">Name<input id="name" type="text" placeholder="Enter yout name" required/></label>
    <label id="email-label">Email<input id="email" type="email" placeholder="Enter yout email" required/></label>
    <label id="number-label">Age<input id="number" type="number" min="10" max="99" placeholder="Age"/></label>
    <label for="dropdown">Which option best describes your current role?
      <select id="dropdown" name="dropdown">
<option value="">Select current role</option>
<option value="1">Student</option>
<option value="2">Full Time Job</option>
<option value="3">Full Time Learner</option>
<option value="4">Prefer not to say</option>
<option value="5">other</option>
        </select>
    </label>
    <fieldset>
      <legend>Would you recommend freeCodeCamp to a friend?</legend>
      <label for="definetly"><input
            id="definetly"
            type="radio"
            name="reccomendation"
            class="inline"
            value="0"
            checked
          />
          Definetly</label>
          <label for="maybe"><input
            id="maybe"
            type="radio"
            name="reccomendation"
            class="inline"
            value="1"
          />
          Maybe</label>
          <label for="notSure"><input
            id="notSure"
            type="radio"
            name="reccomendation"
            class="inline"
            value="2"
          />
          Not sure</label>
      </fieldset>
      <label for="favorite">What is your favorite feature of freeCodeCamp?
      <select id="favorite" name="favorite">
<option value="">Select current role</option>
<option value="1">Challenges</option>
<option value="2">Projects</option>
<option value="3">Community</option>
<option value="4">Open Sourse</option>
        </select>
    </label>
    <fieldset>
      <legend>What would you like to see improved? (Check all that apply)</legend>
      <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="1"
          />
          Front-end Projects</label>
          <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="1"
          />
          Back-end Projects</label>
          <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="2"
          />
          Data Visualization</label>
          <label for="definetly"><input
            id="definetly"
           type="checkbox"
          required
            class="inline"
            value="3"
          />
          Challenges</label>
          <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="4"
          />
          Open Source Community</label>
          <label for="definetly"><input
            id="definetly"
           type="checkbox"
          required
            class="inline"
            value="5"
          />
          Gitter help rooms</label>
          <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="5"
          />
         Videos</label>
          <label for="definetly"><input
            id="definetly"
           type="checkbox"
          required
            class="inline"
            value="6"
          />
          City Meetups</label>
          <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="7"
          />
          Wiki</label>
          <label for="definetly"><input
            id="definetly"
           type="checkbox"
          required
            class="inline"
            value="8"
          />
          Forum</label>
          <label for="definetly"><input
            id="definetly"
            type="checkbox"
          required
            class="inline"
            value="9"
          />
          Additional Courses</label>
      </fieldset>
      <label for="comments"
          >Any comments or suggestions?
          <textarea
            id="comments"
            name="comments"
            rows="3"
            cols="30"
            placeholder="Enter your comment here..."
          ></textarea>

      <input id="submit"type="submit" value="Submit" />
    </form>
  </body>
  </html>
